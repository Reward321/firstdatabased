<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>People Database</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ddd;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #eee;
    }

    .tables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 600px) {
      .tables {
        grid-template-columns: 1fr;
      }
    }

    #message {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>People Database</h1>

  <!-- FORM -->
  <div class="card">

    <h2>Add Person</h2>

    <form id="personForm">

      <label>Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter name"
        required
      >

      <label>Date of Birth</label>
      <input
        type="date"
        id="dob"
        required
      >

      <label>Sex</label>
      <select id="sex" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <button type="submit">
        Submit
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- MAIN TABLE -->
  <div class="card">

    <h2>All People</h2>

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>DOB</th>
          <th>Sex</th>
        </tr>
      </thead>

      <tbody id="peopleTable">
      </tbody>

    </table>

  </div>


  <!-- TWO SMALL TABLES -->
  <div class="tables">

    <!-- SEX TABLE -->
    <div class="card">

      <h2>Sex Count</h2>

      <table>

        <thead>
          <tr>
            <th>Sex</th>
            <th>Count</th>
          </tr>
        </thead>

        <tbody id="sexTable">
        </tbody>

      </table>

    </div>


    <!-- YEAR TABLE -->
    <div class="card">

      <h2>Birth Year</h2>

      <table>

        <thead>
          <tr>
            <th>Year</th>
            <th>Count</th>
          </tr>
        </thead>

        <tbody id="yearTable">
        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

  // ==========================
  // SUPABASE SETTINGS
  // ==========================

  const SUPABASE_URL = "https://pnvchkqqoxomyyodikfr.supabase.co";

  const SUPABASE_KEY = "";


  // ==========================
  // GET DATA
  // ==========================

  async function getPeople() {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/people?select=*`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await response.json();

    displayPeople(data);
    createSexTable(data);
    createYearTable(data);
  }


  // ==========================
  // DISPLAY MAIN TABLE
  // ==========================

  function displayPeople(data) {

    const table = document.getElementById("peopleTable");

    table.innerHTML = "";

    data.forEach(person => {

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${person.name}</td>
        <td>${person.dob}</td>
        <td>${person.sex}</td>
      `;

      table.appendChild(row);

    });
  }


  // ==========================
  // SEX COUNT
  // ==========================

  function createSexTable(data) {

    const counts = {};

    data.forEach(person => {

      if (counts[person.sex]) {
        counts[person.sex]++;
      } else {
        counts[person.sex] = 1;
      }

    });


    const table = document.getElementById("sexTable");

    table.innerHTML = "";

    for (const sex in counts) {

      table.innerHTML += `
        <tr>
          <td>${sex}</td>
          <td>${counts[sex]}</td>
        </tr>
      `;

    }
  }


  // ==========================
  // BIRTH YEAR COUNT
  // ==========================

  function createYearTable(data) {

    const counts = {};

    data.forEach(person => {

      const year = person.dob.substring(0, 4);

      if (counts[year]) {
        counts[year]++;
      } else {
        counts[year] = 1;
      }

    });


    const table = document.getElementById("yearTable");

    table.innerHTML = "";

    for (const year in counts) {

      table.innerHTML += `
        <tr>
          <td>${year}</td>
          <td>${counts[year]}</td>
        </tr>
      `;

    }
  }


  // ==========================
  // SUBMIT FORM
  // ==========================

  document
    .getElementById("personForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value;
      const dob = document.getElementById("dob").value;
      const sex = document.getElementById("sex").value;

      const message = document.getElementById("message");

      message.textContent = "Submitting...";


      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/people`,
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            name: name,
            dob: dob,
            sex: sex
          })
        }
      );


      if (response.ok) {

        message.textContent = "Added successfully!";

        document
          .getElementById("personForm")
          .reset();

        getPeople();

      } else {

        const error = await response.text();

        console.log(error);

        message.textContent =
          "Something went wrong.";

      }

    });


  // Load data when page opens
  getPeople();
console.log("JS is running");
console.log("URL:", SUPABASE_URL);
console.log("KEY exists:", SUPABASE_KEY.length > 0);

fetch(`${SUPABASE_URL}/rest/v1/people?select=*`, {
  headers: {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`
  }
})
.then(async response => {
  console.log("HTTP STATUS:", response.status);

  const data = await response.json();

  console.log("SUPABASE RESPONSE:", data);
})
.catch(error => {
  console.error("FETCH ERROR:", error);
});
</script>

</body>
</html>
